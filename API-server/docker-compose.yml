services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: productivity_hub_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: Passw0rd123
      POSTGRES_DB: productivity_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: productivity_hub_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
